version: "3.9"

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gidalisting
      POSTGRES_PASSWORD: gidalisting
      POSTGRES_DB: gidalisting
    ports:
      - "5432:5432"
    volumes:
      - gidalisting_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gidalisting"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: gidalisting
      MINIO_ROOT_PASSWORD: gidalisting123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - gidalisting_minio_data:/data

volumes:
  gidalisting_postgres_data:
  gidalisting_minio_data:
